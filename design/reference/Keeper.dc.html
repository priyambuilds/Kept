      ticks: st ? [0.18, 0.39, 0.61, 0.82].map(t => { const x = q(t, 60, 80, 100), y = q(t, st[0], st[1], st[2]); return `M${x.toFixed(1)} ${(y - 4.5).toFixed(1)} Q${(x + 1).toFixed(1)} ${y.toFixed(1)} ${x.toFixed(1)} ${(y + 4.5).toFixed(1)}`; }).join(' ') : 'M0 0',
      hole: on(grin || open), teeth: on(grin), tp: tp || 'M0 0',
    };
    const E = { dL: F.eL, dR: F.eR };
    const M = { d: grin ? 'M56 82 Q80 92 104 82 Q101 107 80 107 Q59 107 56 82 Z' : open ? 'M80 85 C86 85 87 91 87 94 C87 99 84 101 80 101 C76 101 73 99 73 94 C73 91 74 85 80 85 Z' : 'M0 0' };
    MD.t = MD.t2;
    const X = { vein: on(MD.vein), spark: on(MD.spark && !bust), lines: on(MD.lines && !bust) };
    const P = Object.fromEntries(['seal', 'ledger', 'lens', 'coin', 'sack', 'cup', 'scythe'].map(k => [k, on(!bust && prop === k)]));
    const RH = { none: [118, 142, -10, 'fist'], seal: [128, 96, 0, 'fist'], flip: [124, 132, -20, 'fist'], ledger: [118, 136, -20, 'fist'], lens: [127, 116, 10, 'fist'], coin: [128, 108, -10, 'fist'], sack: [138, 98, 0, 'fist'], cup: [130, 124, -10, 'fist'], whisper: [106, 96, -25, 'open'], scythe: [118, 122, 0, 'fist'] }[prop] || [118, 142, -10, 'fist'];
    let LH = mood === 'shades' ? [36, 120, 20, 'open'] : mood === 'shocked' ? [30, 108, 30, 'open'] : [40, 142, 10, 'fist'];
    let RHm = [...RH]; if (this.props.hand) RHm = [128, 112, 0, this.props.hand];
    const t = this.state.t || 0, live = t > 0, an = this.props.anim ?? (prop === 'flip' ? 'flip' : 'idle');
    const S = Math.sin, ease = p => 1 - Math.pow(1 - p, 3), back = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
    let ty = live ? S(t * 2.4) * 1.4 : 0, sx = 1, sy = 1, tiltA = 0, hsR = 1, gyA = 0, gxA = 0, wig = live ? S(t * 3) * 3 : 0;
    const C = { on: on(!bust && (an === 'flip' || prop === 'flip')), y: -46, ry: 4, ry2: 2, fill: '#C5F25C', face: 'inline', trail: 'inline', ty: 80, ty2: 60 };
    if (live) {
      RHm[1] += S(t * 2.4 + .6) * 1.4; LH[1] += S(t * 2.4 + .9) * 1.4;
      if (an === 'idle' && (t % 6.5) > 5.2) gxA = 4;
      if (an === 'flip') { const p = (t % 1.7) / 1.7; RHm = [124, 130, -10, 'fist'];
        if (p < .12) RHm[2] = -10 - p / .12 * 30; else if (p < .2) RHm[2] = -40 + (p - .12) / .08 * 60; else RHm[2] = 20 - Math.min(1, (p - .2) / .2) * 30;
        if (p > .1 && p < .9) { const q = (p - .1) / .8, cy = -60 * 4 * q * (1 - q); C.y = cy; C.ry = Math.max(.8, 10 * Math.abs(Math.cos(q * Math.PI * 5))); C.fill = Math.cos(q * Math.PI * 5) > 0 ? '#C5F25C' : '#A9D23E'; C.ry2 = C.ry * .55; C.face = on(C.ry > 4); C.trail = on(q > .15 && q < .85); C.ty = 100 + cy * .5; C.ty2 = 100 + cy; gyA = cy * .05; tiltA = cy * .06; }
        else { C.y = 4; C.ry = 10; C.ry2 = 5.5; C.trail = 'none'; if (p >= .9) RHm[1] += 3; } }
      if (an === 'wave') { RHm = [136, 90, 18 * S(t * 9), 'open']; tiltA = 5; }
      if (an === 'point') { RHm = [128, 112, -8, 'point']; hsR = 1 + .16 * Math.max(0, S(t * 5)); tiltA = -4; }
      if (an === 'thumbs') { RHm = [130, 110 - 4 * Math.abs(S(t * 3)), 0, 'thumb']; hsR = 1 + .08 * Math.abs(S(t * 3)); }
      if (an === 'tap') { LH = [48, 120, 85, 'fist']; RHm = [70, 108 - Math.max(0, S(t * 10)) * 4, -70, 'point']; tiltA = 4; }
      if (an === 'shrug') { const k = Math.max(0, S(t * 2.2)); LH = [24, 114 - k * 6, -35, 'open']; RHm = [136, 114 - k * 6, 35, 'open']; tiltA = 7 * k; ty -= k * 2; }
      if (an === 'jump') { const p = (t % 1.8) / 1.8; if (p < .15) { sy = 1 - .1 * S(p / .15 * Math.PI); sx = 2 - sy; } else if (p < .55) { const q = (p - .15) / .4; ty = -18 * S(q * Math.PI); sy = 1.05; sx = .96; LH = [26, 98, -30, 'open']; RHm = [134, 98, 30, 'open']; } else if (p < .68) { sy = 1 - .12 * S((p - .55) / .13 * Math.PI); sx = 2 - sy; } }
      if (an === 'peek' || an === 'popin') { const p = an === 'peek' ? (t % 4.4) : Math.min(t, 3); let off = 0;
        if (p < .55) { const q = back(p / .55); off = 120 * (1 - q); sy = .85 + .15 * Math.min(1, q); }
        else if (p < 1.9) RHm = [136, 90, 18 * S(p * 9), 'open'];
        else if (an === 'peek' && p > 3.7) { const q = Math.min(1, (p - 3.7) / .4); off = 130 * q * q; sy = 1 + .08 * q; sx = 1 - .05 * q; }
        ty += off; }
    }
    const bl = live && an !== 'jump' && (t % 3.7) < .13 ? .12 : 1;
    const rootT = `translate(0 ${ty.toFixed(2)}) translate(80 178) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(-80 -178)`;
    this.__gxA = gxA; this.__gyA = gyA;
    const blinkT = `translate(0 62) scale(1 ${bl}) translate(0 -62)`;
    const pose = (p, k) => ({ open: on(p === 'open'), fist: on(p === 'fist'), point: on(p === 'point'), thumb: on(p === 'thumb'), wig: p === 'open' ? wig : 0 });
    const hands = bust ? [] : [{ t: `translate(${LH[0]} ${LH[1].toFixed(1)}) rotate(${LH[2]}) scale(-1.75 1.75)`, ...pose(LH[3] || 'fist') }, { t: `translate(${RHm[0]} ${RHm[1].toFixed(1)}) rotate(${RHm[2].toFixed(1)}) scale(${(1.75 * hsR).toFixed(3)})`, ...pose(RHm[3]) }];
    const sleeve = (sx, sy, hx, hy, bend) => `M${sx} ${sy} Q${(sx + hx) / 2 + bend} ${(sy + hy) / 2 + 8} ${hx} ${hy}`;
    const A = {
      lx: LH[0], ly: LH[1], lr: LH[2], rx: RH[0], ry: RH[1], rr: RH[2], fist: on(RH[3] === 'fist'), open: on(RH[3] === 'open'),
      sl: sleeve(46, 108, LH[0], LH[1] + 6, -6), sr: sleeve(114, 108, RHm[0], RHm[1] + 6, 6),
    };
    return {
      hands, rootT, blinkT, C,
      idL: this.uid + 'L', idR: this.uid + 'R', idM: this.uid + 'M', E, M, F, X, P, A,
      body: on(!bust), jaw: MD.mouth === 'open' ? 5 : MD.mouth === 'grin' ? 2 : 0,
      tilt: ((MD.t2 || 0) + tiltA).toFixed(2), ov: bust ? 'hidden' : 'visible',
      vb: bust ? '28 4 104 104' : '0 0 160 180', w: size, h: bust ? size : Math.round(size * 180 / 160),
    };
  }
}
