<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;cfg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;13050010&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;tsType&quot;:&quot;number&quot;}}">
const SKN = ['#F6C9A8', '#C98E62', '#7A4A2E', '#F08A3C', '#7BC96F', '#A9B4C6', '#EFE8D8', '#9D86F9'];
const OC = ['#7C3AED', '#C5F25C', '#38BDF8', '#F472B6', '#FB923C', '#F2F0EA', '#2A2A33'];
const BG = ['#C5F25C', '#A78BFA', '#38BDF8', '#F9A8D4', '#FDE68A', '#5EEAD4', '#2E2E36', '#FB923C'];
// per species: eye L x, eye R x, eye y, ear L, ear R, head top
const SP = [[43, 57, 47, [31, 52], [69, 46], 22], [41.5, 58.5, 43.5, [33, 46], [64, 36], 26], [42, 58, 47, [34, 45], [65, 34], 30], [38, 62, 37, [29, 56], [69, 44], 28], [42, 58, 45, [32, 38], [66, 30], 24], [43, 57, 44.5, [29, 55], [71, 44], 26], [43, 57, 45, [33, 50], [66, 42], 25], [41, 59, 42.5, [31, 47], [68, 37], 22]];
function mix(hex, t, to) { const h = hex.replace('#', ''), n = parseInt(h, 16), c = [n >> 16, (n >> 8) & 255, n & 255], d = to ? 255 : 0; return '#' + c.map(v => Math.round(v + (d - v) * t).toString(16).padStart(2, '0')).join(''); }
class Component extends DCLogic {
  renderVals() {
    const d = String(this.props.cfg || '13050010').replace(/\D/g, '').padEnd(8, '0').split('').map(Number);
    const s = d[0] % 8, e = d[2] % 4, hat = d[3] % 6, o = d[4] % 5, it = d[6] % 4, sp = SP[s];
    const sk = SKN[d[1] % 8], oc = OC[d[5] % 7], bg = BG[d[7] % 8], on = c => c ? 'inline' : 'none';
    const [x1, x2, y] = sp, f = v => Math.round(v * 10) / 10;
    return { size: this.props.size ?? 120,
      bg, bgD: mix(bg, .14), bgL: mix(bg, .12, 1), sk, skD: mix(sk, .2), skDD: mix(sk, .42), skL: mix(sk, .35, 1), oc, ocD: mix(oc, .22), ocDD: mix(oc, .42), ocL: mix(oc, .3, 1),
      s0: on(s === 0), s1: on(s === 1), s2: on(s === 2), s3: on(s === 3), s4: on(s === 4), s5: on(s === 5), s6: on(s === 6), s7: on(s === 7),
      o0: on(o === 0), o1: on(o === 1), o2: on(o === 2), o3: on(o === 3), o4: on(o === 4),
      eD: on(e === 0), e1: on(e === 1), e2: on(e === 2), e3: on(e === 3),
      ex1: x1, ex2: x2, ey: y,
      sl: `M${f(x1 - 4)} ${y} Q${x1} ${f(y + 3)} ${f(x1 + 4)} ${y} M${f(x2 - 4)} ${y} Q${x2} ${f(y + 3)} ${f(x2 + 4)} ${y} M${f(x1 - 4.5)} ${f(y - 1.5)} L${f(x1 + 4.5)} ${f(y - 1.5)} M${f(x2 - 4.5)} ${f(y - 1.5)} L${f(x2 + 4.5)} ${f(y - 1.5)}`,
      lz: `M${x1} ${y} L104 ${f(y + 22)} M${x2} ${y} L104 ${f(y + 12)}`,
      shx: f(x1 - 7.5), shy: f(y - 4.5), shw: f(x2 - x1 + 15), shg: `M${f(x1 - 4)} ${f(y - 1.5)} L${f(x1 - 0.5)} ${f(y - 1.5)}`,
      h1: on(hat === 1), h2: on(hat === 2), h3: on(hat === 3), h4: on(hat === 4), h5: on(hat === 5), dy: f(y - 50 - (s === 3 ? 4 : 0)),
      i1: on(it === 1), i2: on(it === 2), i3: on(it === 3), erx: sp[4][0], ery: sp[4][1], elx: sp[3][0], ely: sp[3][1], bx: f(x1 - 1), by: f(y + 9) };
  }
}
