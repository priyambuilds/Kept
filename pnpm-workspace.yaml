packages:
  - apps/*
  - packages/*
  - programs/kept

# React Native autolinking, Gradle and Metro are most reliable with a flat node_modules.
nodeLinker: hoisted

# Dependencies allowed to run install scripts (replaces the npm-11 "allowScripts"
# block that used to live in backend/package.json).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  prisma: true
  utf-8-validate: true
  unrs-resolver: true
